<title>Python desde cero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: una sola columna tipo cuaderno de ejercicios, pensada para el pulgar. Lista de lecciones -> tarjetas de lectura -> ejercicios con barra inferior de comprobación. */
:root{
  --bg:#EBF0F5; --surface:#FFFFFF; --surface2:#F4F7FA; --ink:#0F1B2D; --muted:#566478; --line:#D3DBE6;
  --accent:#0E6BA8; --accent-deep:#0A4F7C; --accent-ink:#FFFFFF; --accent-soft:#DAEAF6;
  --spark:#B97C00; --flame:#D9531E;
  --lock-bg:#D5DDE8; --lock-shadow:#B9C4D3; --lock-fg:#7A8AA0; --track:#C7D0DD; --on-good:#FFFFFF; --good-deep:#0F5A36;
  --good:#17784A; --good-bg:#DCF2E4; --bad:#B3261E; --bad-bg:#FBE0DD;
  --code-bg:#F2F5F9; --kw:#B02A5B; --str:#18764A; --num:#A85A08; --cm:#6A7889; --fn:#0A6CA8;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B121B; --surface:#141E2B; --surface2:#1A2636; --ink:#E8EEF5; --muted:#93A1B4; --line:#273649;
    --accent:#5AB8EE; --accent-deep:#2F86B8; --accent-ink:#06141F; --accent-soft:#17324A;
    --spark:#F2C14E; --flame:#FF8A4C;
    --lock-bg:#1F2B3B; --lock-shadow:#141D29; --lock-fg:#62738A; --track:#223044; --on-good:#06241A; --good-deep:#3FA971;
    --good:#6FD79A; --good-bg:#12301F; --bad:#FF8F85; --bad-bg:#3A1715;
    --code-bg:#0A1019; --kw:#F27BA6; --str:#7FD99F; --num:#F2B35C; --cm:#8795A8; --fn:#6CC4F2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B121B; --surface:#141E2B; --surface2:#1A2636; --ink:#E8EEF5; --muted:#93A1B4; --line:#273649;
  --accent:#5AB8EE; --accent-deep:#2F86B8; --accent-ink:#06141F; --accent-soft:#17324A;
  --spark:#F2C14E; --flame:#FF8A4C;
  --lock-bg:#1F2B3B; --lock-shadow:#141D29; --lock-fg:#62738A; --track:#223044; --on-good:#06241A; --good-deep:#3FA971;
  --good:#6FD79A; --good-bg:#12301F; --bad:#FF8F85; --bad-bg:#3A1715;
  --code-bg:#0A1019; --kw:#F27BA6; --str:#7FD99F; --num:#F2B35C; --cm:#8795A8; --fn:#6CC4F2;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5;
  margin:0; padding-block:20px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{cursor:not-allowed}
h1,h2,h3,p,ol{margin:0}
ol{padding:0;list-style:none}
code{font-family:var(--f-mono);font-size:.88em;background:var(--accent-soft);color:var(--ink);padding:.08em .38em;border-radius:5px}
.app{max-width:560px;margin:0 auto;min-width:0}
.app.has-dock{padding-bottom:190px}
.ic{display:inline-flex;width:1.25em;height:1.25em;flex:none}
.ic svg{width:100%;height:100%;fill:currentColor}

/* Inicio */
.head{display:grid;gap:6px;padding:6px 0 18px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2.1rem,9vw,2.8rem);line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px;display:grid;gap:2px;min-width:0}
.stat .row{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:800;font-size:1.45rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{font-size:.74rem;color:var(--muted);line-height:1.2}
.t-flame{color:var(--flame)} .t-spark{color:var(--spark)} .t-good{color:var(--good)}
.lead{color:var(--muted);margin:16px 0 18px;max-width:46ch}
/* Mapa de lecciones: camino serpenteante, círculos alternando izquierda y derecha */
.map{position:relative;width:100%;max-width:360px;margin:6px auto 0}
.map-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.map-lines path{fill:none;stroke-width:15;stroke-linecap:butt}
.trk{stroke:var(--track)}
.prg{stroke:var(--good);stroke-dasharray:1 1;stroke-dashoffset:1;transition:stroke-dashoffset .9s ease-in-out}
.prg.lit{stroke-dashoffset:0}
.node{position:absolute;width:0;height:0;z-index:1;--bg:var(--lock-bg);--sh:var(--lock-shadow);--fg:var(--lock-fg)}
.node[data-s="done"]{--bg:var(--good);--sh:var(--good-deep);--fg:var(--on-good)}
.node[data-s="current"]{--bg:var(--accent);--sh:var(--accent-deep);--fg:var(--accent-ink)}
.node-btn{position:absolute;left:-42px;top:-42px;width:84px;height:84px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;
  background:var(--bg);color:var(--fg);box-shadow:0 7px 0 var(--sh);
  transition:background-color .5s ease,color .5s ease,box-shadow .5s ease,transform .12s ease}
.node-btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 var(--sh)}
.node-btn:focus-visible{outline:3px solid var(--accent);outline-offset:5px}
.node-btn:disabled{cursor:not-allowed}
.glyph{grid-area:1/1;width:40px;height:40px;display:grid;place-items:center;opacity:0;transform:scale(.5);transition:opacity .35s ease,transform .35s ease}
.glyph .ic{width:100%;height:100%}
.node[data-s="locked"] .g-lock,.node[data-s="current"] .g-play,.node[data-s="done"] .g-check{opacity:1;transform:none}
.node[data-s="current"] .node-btn::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--accent);opacity:.45;pointer-events:none;animation:ring 1.9s ease-out infinite}
.node.unlocking .node-btn{animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
.tip{position:absolute;left:0;bottom:58px;transform:translateX(-50%);white-space:nowrap;background:var(--surface);color:var(--accent);
  border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-family:var(--f-display);font-weight:800;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s ease,visibility .3s ease}
.tip::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.node[data-s="current"] .tip{opacity:1;visibility:visible;animation:bob 1.4s ease-in-out infinite}
.nlabel{position:absolute;top:0;transform:translateY(-50%);width:150px;display:grid;gap:2px;pointer-events:none}
.node.left .nlabel{left:60px;text-align:left}
.node.right .nlabel{right:60px;text-align:right;justify-items:end}
.nt{font-family:var(--f-display);font-weight:700;font-size:1.02rem;line-height:1.15;transition:color .5s ease}
.ns{font-size:.8rem;color:var(--muted);line-height:1.25}
.node[data-s="locked"] .nt{color:var(--muted)}
.slot:empty{display:none}
@keyframes ring{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.22);opacity:0}}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
@keyframes pop{0%{transform:scale(.78)}100%{transform:scale(1)}}
.stars{display:inline-flex;gap:2px;color:var(--line)}
.stars .ic{width:1.05em;height:1.05em}
.stars .on{color:var(--spark)}
.stars.big .ic{width:2.6rem;height:2.6rem}
.stars.big{gap:6px}
.next-week{margin-top:18px;font-size:.88rem;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:12px 14px}

/* Separador de semana: cartel con estado (bloqueada, desbloqueada, completada, próximamente) */
.weeks{display:grid;gap:34px;margin-top:6px}
.week{display:grid;gap:6px}
.wbanner{position:relative;overflow:hidden;border-radius:18px;padding:16px;display:grid;gap:10px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);box-shadow:0 3px 0 var(--line);
  transition:background-color .6s ease,color .6s ease,border-color .6s ease,box-shadow .6s ease}
.wbanner::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--accent),var(--accent-deep));opacity:0;transition:opacity .7s ease;pointer-events:none}
.wbanner>*{position:relative}
.wbanner[data-s="open"]{color:var(--accent-ink);border-color:transparent;box-shadow:0 4px 0 var(--accent-deep)}
.wbanner[data-s="open"]::before{opacity:1}
.wbanner[data-s="done"]{background:var(--good);color:var(--on-good);border-color:transparent;box-shadow:0 4px 0 var(--good-deep)}
.wbanner[data-s="soon"]{background:transparent;border-style:dashed;box-shadow:none}
.wb-head{display:flex;align-items:center;gap:12px}
.wb-ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--lock-bg);color:var(--lock-fg);transition:background-color .6s ease,color .6s ease}
.wb-ico .ic{width:24px;height:24px}
.wbanner[data-s="open"] .wb-ico,.wbanner[data-s="done"] .wb-ico{color:inherit;background:rgba(127,127,127,.25);background:color-mix(in srgb,currentColor 22%,transparent)}
.wb-txt{display:grid;gap:2px;min-width:0}
.wb-kicker{font-size:.76rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.wbanner[data-s="locked"] .wb-kicker,.wbanner[data-s="soon"] .wb-kicker{color:var(--muted)}
.wb-title{font-family:var(--f-display);font-weight:800;font-size:1.4rem;line-height:1.1;text-wrap:balance}
.wb-desc{font-size:.92rem;line-height:1.4;max-width:46ch}
.wbanner[data-s="locked"] .wb-desc,.wbanner[data-s="soon"] .wb-desc{color:var(--muted)}
.wb-chips{display:flex;flex-wrap:wrap;gap:6px}
.wb-chip{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px;background:rgba(127,127,127,.18);background:color-mix(in srgb,currentColor 14%,transparent)}
.wbanner.unlocking{animation:bpop .8s cubic-bezier(.3,1.5,.5,1)}
@keyframes bpop{0%{transform:scale(.93)}100%{transform:scale(1)}}
/* Lección */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--muted)}
.bar{flex:1;height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.q{font-family:var(--f-display);font-weight:700;font-size:1.45rem;line-height:1.2;margin-bottom:16px;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 18px;display:grid;gap:12px}
.card h2{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.card p{max-width:60ch}
b{font-weight:700}

/* Código */
.code{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:4px 0 14px}
.code-tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 12px;border-bottom:1px solid var(--line);background:var(--surface2)}
.code pre{margin:0;padding:12px 12px;overflow-x:auto;font-family:var(--f-mono);font-size:13px;line-height:1.7;tab-size:4;color:var(--ink)}
.card .code{margin:0}
.card .code pre{font-size:12px}
.kw{color:var(--kw);font-weight:500}.str{color:var(--str)}.num-t{color:var(--num)}.cm{color:var(--cm);font-style:italic}.fn{color:var(--fn)}
.blank{display:inline-block;min-width:3.6ch;min-height:1.6em;vertical-align:baseline;padding:0 .5ch;margin:0 1px;border:0;border-bottom:2px dashed var(--accent);background:var(--accent-soft);color:var(--ink);font:inherit;border-radius:5px;text-align:center;line-height:1.5}
.blank.filled{border-bottom-style:solid}
.blank.ok{background:var(--good-bg);border-bottom-color:var(--good);color:var(--good)}
.blank.bad{background:var(--bad-bg);border-bottom-color:var(--bad);color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.chip{font-family:var(--f-mono);font-size:1rem;min-height:46px;padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);box-shadow:0 2px 0 var(--line)}
.chip:active{transform:translateY(1px);box-shadow:0 1px 0 var(--line)}
.chip:disabled{opacity:.55}
.lines{display:grid}
.ln{display:grid;grid-template-columns:2.4ch minmax(0,1fr);gap:1.2ch;width:100%;text-align:left;background:transparent;border:0;border-radius:6px;padding:0 6px;margin:0;font:inherit;color:inherit;white-space:pre;overflow-x:auto;min-height:32px;align-items:center}
.ln .no{color:var(--muted);text-align:right;user-select:none}
.ln.sel{background:var(--accent-soft);outline:1px solid var(--accent)}
.ln.ok{background:var(--good-bg);outline:1px solid var(--good)}
.ln.bad{background:var(--bad-bg);outline:1px solid var(--bad)}
.code .lines{padding:8px 6px}

/* Opciones */
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;min-height:54px;box-shadow:0 2px 0 var(--line);display:flex;align-items:center;gap:12px}
.opt:active{transform:translateY(1px);box-shadow:0 1px 0 var(--line)}
.opt .k{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{background:var(--good);color:var(--good-bg);border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:var(--bad-bg);border-color:var(--bad)}
.sub-q{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:18px 0 10px}
.hint-ok{display:flex;align-items:center;gap:8px;color:var(--good);font-weight:600;margin:14px 0 0}

/* Barra inferior */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.dock.good{background:var(--good-bg);border-top-color:var(--good)}
.dock.bad{background:var(--bad-bg);border-top-color:var(--bad)}
.dock-in{max-width:560px;margin:0 auto;display:grid;gap:12px}
.fb{display:grid;gap:4px}
.fb h3{font-family:var(--f-display);font-weight:800;font-size:1.3rem;display:flex;align-items:center;gap:8px}
.dock.good .fb h3{color:var(--good)} .dock.bad .fb h3{color:var(--bad)}
.fb p{font-size:.95rem;line-height:1.4}
.fb .ic{width:1.1em;height:1.1em}
.btn{width:100%;min-height:52px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:.01em;box-shadow:0 3px 0 var(--accent-deep)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--accent-deep)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:none}
.dock.good .btn{background:var(--good);color:var(--good-bg);box-shadow:0 3px 0 color-mix(in srgb,var(--good) 60%,black)}
.dock.bad .btn{background:var(--bad);color:var(--bad-bg);box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 60%,black)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;border:1px solid var(--line);font-weight:700}

/* Final */
.done{display:grid;gap:18px;text-align:center;justify-items:center;padding-top:10px}
.done h2{font-family:var(--f-display);font-weight:800;font-size:2.1rem;line-height:1.05;text-wrap:balance}
.done .ttl{color:var(--muted)}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.res div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 6px;display:grid;gap:2px}
.res strong{font-family:var(--f-display);font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.res span{font-size:.76rem;color:var(--muted)}

@media (prefers-reduced-motion:no-preference){
  .dock-in{animation:rise .18s ease-out}
  @keyframes rise{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app" class="app"></div>

<script>
(function(){
'use strict';

/* ---------- Contenido: Semana 1 ---------- */
const L=(...a)=>a.join('\n');

const LESSONS=[
{
  title:'Variables y tipos', sub:'Guardar datos y saber qué son',
  cards:[
    {h:'Una variable es una etiqueta', p:['Con `=` le ponés un nombre a un valor. Después usás ese nombre cada vez que necesitás el valor.','Con `print()` lo mostrás en pantalla. Python decide el tipo solo: no hay que declararlo.'],
     code:L('nombre = "Lucía"','edad = 28','print(nombre)   # muestra Lucía','print(edad)     # muestra 28')},
    {h:'Los cuatro tipos básicos', p:['`str` es texto: va entre comillas, y si adentro hay números también es texto (`"10"` es `str`).','`int` es un número entero. `float` es un decimal: tiene punto, y `3.0` es `float` aunque sea redondo.','`bool` es `True` o `False`, con la primera letra en mayúscula. Con `type()` ves de qué tipo es algo.'],
     code:L('type("hola")  # str','type("10")    # str','type(28)      # int','type(3.0)     # float','type(True)    # bool')},
    {h:'Reglas para los nombres', p:['Un nombre puede tener letras, números y `_`. No puede empezar con número, ni tener espacios o guiones, ni ser una palabra que Python ya usa (`if`, `for`, `class`...).','Las mayúsculas cuentan: `precio` y `Precio` son nombres distintos. Si escribís un nombre que no existe, Python avisa con `NameError`. Por eso `true` en minúscula también da `NameError`: no es un booleano, lo toma como un nombre.'],
     code:L('precio = 10','print(precio)   # 10','print(Precio)   # NameError')}
  ],
  ex:[
    {t:'fill', q:'Guardá 25 en una variable llamada `edad` y mostrala.', code:L('___ = 25','print(___)'), ans:['edad','edad'], bank:['edad','25','"edad"','print'],
     why:'La variable va a la izquierda del `=` y se usa por su nombre, sin comillas. Con comillas sería el texto "edad".'},
    {t:'quiz', q:'¿De qué tipo es `x`?', code:'x = 3.0', opts:['`int`','`float`','`str`','`bool`'], a:1,
     why:'Tiene punto decimal, así que es `float`, aunque el valor sea redondo.'},
    {t:'bug', q:'Tocá la línea con el error.', code:L('activo = true','print(activo)'), line:0,
     why:'Los booleanos se escriben con mayúscula: `True` y `False`. Con `true` Python busca una variable que no existe y lanza NameError.',
     fix:{q:'¿Cómo se arregla?', opts:['Escribir `True` con mayúscula','Poner `true` entre comillas','Cambiar `=` por `==`','Borrar el `print`'], a:0}},
    {t:'quiz', q:'¿De qué tipo es `x`?', code:'x = "10"', opts:['`int`','`float`','`str`','`bool`'], a:2,
     why:'Todo lo que va entre comillas es texto (`str`), aunque parezca un número.'},
    {t:'bug', q:'Esto lanza NameError. Tocá la línea donde salta.', code:L('precio = 10','print(Precio)'), line:1,
     why:'Python distingue mayúsculas de minúsculas: `Precio` y `precio` son nombres distintos.',

{
  title:'Operadores', sub:'Cuentas, comparaciones y lógica',
  cards:[
    {h:'Cuentas', p:['Además de `+`, `-` y `*` tenés tres más. `/` es la división normal y siempre da decimal.','`//` es la división entera: cuenta cuántas veces entra un número en otro. `7 // 2` es 3 porque el 2 entra 3 veces en el 7 (3 × 2 = 6).','`%` da el resto: lo que sobra de esa división. `7 % 2` es 1. Si `n % 2` da 0, `n` es par.','`**` es potencia: `2 ** 3` es 2 × 2 × 2.'],
     code:L('7 / 2    # 3.5','7 // 2   # 3  (entra 3 veces)','7 % 2    # 1  (sobra 1)','8 % 2    # 0  (sobra 0: es par)','2 ** 3   # 8  (2 × 2 × 2)')},
    {h:'Atajos para actualizar', p:['`+=` suma y guarda en la misma variable. `x += 1` es lo mismo que `x = x + 1`.','`-=` resta y `*=` multiplica, igual que `+=`. Python no tiene `++`.'],
     code:L('puntos = 10','puntos += 5   # ahora vale 15','puntos -= 3   # ahora vale 12','print(puntos)  # 12')},
    {h:'Operadores con texto', p:['Con texto, `+` junta los dos textos y `*` repite el texto tantas veces como diga el número.'],
     code:L('"ab" + "cd"   # "abcd"','"ab" * 3      # "ababab"','"-" * 5       # "-----"')},
    {h:'Preguntas que dan True o False', p:['Una comparación es una pregunta y Python responde `True` (sí) o `False` (no). `5 > 3` pregunta "¿5 es mayor que 3?": es verdad, así que da `True`. `3 > 5` da `False`.','Los operadores son `>` mayor, `<` menor, `>=` mayor o igual (el ≥ de matemática), `<=` menor o igual (el ≤), `==` igual y `!=` distinto. Se escribe `>=`, nunca `=>`.','Ojo con `=` y `==`: `=` guarda un valor y `==` pregunta si dos cosas son iguales.'],
     code:L('5 > 3   # True (5 es mayor)','3 > 5   # False (3 es menor)','5 > 5   # False (son iguales)','5 >= 5  # True (mayor o igual)','5 != 3  # True (son distintos)','x = 5   # guarda 5 en x','x == 5  # True: ¿x vale 5?')},
    {h:'Combinar con and, or y not', p:['`and` da `True` solo si las dos preguntas dan `True`. `or` da `True` si al menos una lo da. `not` da lo contrario.','Python resuelve primero cada comparación y después las combina.'],
     code:L('3 > 1 and 8 > 5 # True (las dos)','3 > 1 and 8 > 9 # False (falla)','3 > 1 or 8 > 9 # True (basta una)','not 3 > 1 # False (invierte)')}
  ],
  ex:[
    {t:'quiz', q:'¿Qué imprime?', code:'print(7 // 2)', opts:['`3.5`','`3`','`4`','`2`'], a:1,
     why:'`//` es división entera: el 2 entra 3 veces en el 7 (3 × 2 = 6) y se descarta lo que sobra.'},
    {t:'quiz', q:'¿Qué imprime?', code:'print(10 % 3)', opts:['`3`','`0`','`1`','`3.33`'], a:2,
     why:'`%` devuelve el resto. El 3 entra 3 veces en el 10 (3 × 3 = 9) y sobra 1.'},
    {t:'fill', q:'Completá para saber si `edad` es mayor o igual a 18.', code:L('edad = 20','es_mayor = edad ___ 18','print(es_mayor)'), ans:['>='], bank:['>=','=>','=','<'],
     why:'Se escribe `>=`. `=>` no existe en Python y `=` guarda un valor en vez de comparar.'},
    {t:'quiz', q:'¿Qué hace `x == 5` en este código?', code:L('x = 5','print(x == 5)'), opts:['Guarda 5 en `x`','Pregunta si `x` vale 5 y muestra `True`','Da error','Suma 5 a `x`'], a:1,
     why:'`==` compara. Como `x` vale 5, la pregunta "¿x es igual a 5?" da `True`. Para guardar un valor se usa un solo `=`.'},
    {t:'quiz', q:'¿Qué imprime?', code:'print(2 < 9 and 7 > 8)', opts:['`True`','`False`','`None`','Da error'], a:1,
     why:'`2 < 9` da `True`, pero `7 > 8` da `False`. Con `and` tienen que dar `True` las dos.'},
    {t:'quiz', q:'¿Qué imprime?', code:'print(4 > 9 or 6 > 2)', opts:['`True`','`False`','`None`','Da error'], a:0,
     why:'`4 > 9` da `False`, pero `6 > 2` da `True`. Con `or` alcanza con que una lo sea.'},
    {t:'quiz', q:'¿Qué imprime?', code:'print("ab" * 3)', opts:['`ab3`','`ababab`','`ab ab ab`','Da error'], a:1,
     why:'Multiplicar un texto por un número lo repite esa cantidad de veces.'},
    {t:'quiz', q:'¿Qué imprime?', code:'print(2 ** 3)', opts:['`6`','`8`','`9`','`23`'], a:1,
     why:'`**` es potencia: 2 × 2 × 2 = 8.'},
    {t:'quiz', q:'¿Qué imprime?', code:L('puntos = 10','puntos -= 4','print(puntos)'), opts:['`4`','`6`','`10`','`14`'], a:1,

    {t:'quiz', q:'¿Qué imprime?', code:'print(8 % 2 == 0)', opts:['`True`','`False`','`0`','`4`'], a:0,

{
  title:'Condicionales', sub:'if, elif y else',
  cards:[
    {h:'Un programa que decide', p:['Hasta ahora el código corría siempre línea por línea. Con `if` ("si") el programa **elige**: ejecuta un bloque solo **si** la condición es `True`. Si es `False`, lo saltea.','La condición es una pregunta como las de la lección de operadores (`>`, `==`...). El bloque es lo que va con sangría debajo del `:`.'],
     code:L('edad = 20','if edad >= 18:','    print("Podés entrar")   # solo si la condición es True','print("Fin")                # esta siempre se ejecuta','','# edad vale 20 → 20 >= 18 es True → imprime "Podés entrar" y "Fin"','# si edad valiera 15 → es False → solo imprime "Fin"')},
{h:'Decidir qué código corre', p:['Python evalúa las condiciones de arriba hacia abajo y entra al primer bloque verdadero. `else` no lleva condición y cubre todo lo demás.','Cada línea con `if`, `elif` o `else` termina en `:` y el bloque va indentado (4 espacios). Si falta la sangría, Python da `IndentationError`.','Ojo con el límite: `edad > 18` deja afuera al 18, y `edad >= 18` lo incluye.'],
     code:L('nota = 7','if nota >= 6:','    print("Aprobado")','elif nota >= 4:','    print("Recuperatorio")','else:','    print("Desaprobado")')},
    {h:'if, elif y else paso a paso', p:['Con varios caminos, Python prueba las condiciones **de arriba hacia abajo** y se queda con la primera que dé `True`. El resto ni lo mira.','Seguí el ejemplo: con `nota = 5` la primera pregunta da `False`, la segunda da `True`, así que entra ahí y **se saltea el `else`**.'],
     code:L('nota = 5','if nota >= 6:         # 5 >= 6 es False → sigue','    print("Aprobado")','elif nota >= 4:       # 5 >= 4 es True → entra acá','    print("Recuperatorio")','else:                 # no se mira','    print("Desaprobado")','','# imprime: Recuperatorio')},
{h:'Dos if o un elif', p:['Dos `if` seguidos son independientes: cada uno se evalúa por su cuenta y pueden entrar los dos.','Con `elif`, en cambio, Python se detiene en el primer bloque verdadero y se saltea el resto.'],
     code:L('x = 12','if x >= 10:','    print("A")','if x >= 5:','    print("B")','# Imprime A y B (dos if sueltos)')}
  ],
  ex:[
    {t:'fill', q:'Completá la sintaxis.', code:L('edad = 15','if edad >= 18___','    print("Mayor")','else___','    print("Menor")'), ans:[':',':'], bank:[':',';','then',')'],
     why:'Tanto el `if` como el `else` terminan en dos puntos. Python no usa `then`.'},
    {t:'bug', q:'Tocá la línea con el error.', code:L('edad = 20','if edad >= 18','    print("Mayor")'), line:1,
     why:'Falta el `:` al final del `if`. Todo bloque (`if`, `else`, `for`, `while`) lo lleva.',
     fix:{q:'¿Cómo se arregla?', opts:['Agregar `:` al final del `if`','Cambiar `>=` por `>`','Quitar la indentación','Agregar `else`'], a:0}},
    {t:'quiz', q:'¿Qué imprime?', code:L('x = 5','if x >= 10:','    print("A")','elif x >= 3:','    print("B")','else:','    print("C")'), opts:['`A`','`B`','`C`','`B` y `C`'], a:1,
     why:'`x >= 10` es falso, pero `x >= 3` es verdadero: entra a ese bloque y se saltea el `else`.'},
    {t:'bug', q:'Esto lanza IndentationError. Tocá la línea con el problema.', code:L('if 5 >= 3:','print("sí")'), line:1,
     why:'Después de los dos puntos, el bloque va indentado. Esa sangría le dice a Python qué código pertenece al `if`.',
     fix:{q:'¿Cómo se arregla?', opts:['Indentar el `print` con 4 espacios','Agregar `else`','Cambiar `>=` por `<=`','Quitar los dos puntos'], a:0}},
    {t:'quiz', q:'¿Qué imprime?', code:L('x = 9','if x >= 7:','    print("A")','if x >= 4:','    print("B")'), opts:['Solo `A`','Solo `B`','`A` y `B`, en dos líneas','Nada'], a:2,
     why:'Son dos `if` independientes y ambos son verdaderos. Con `elif`, solo entraría al primero.'},
    {t:'fill', q:'Completá para imprimir "impar" cuando no sea par.', code:L('n = 7','if n % 2 == 0:','    print("par")','___:','    print("impar")'), ans:['else'], bank:['else','elif','if','otherwise'],
     why:'`else` cubre todo lo que no cumplió el `if` y no lleva condición. `elif` necesitaría una.'},
    {t:'quiz', q:'En una cadena if/elif/else, ¿cuántos bloques se ejecutan como máximo?', opts:['Uno','Todos los verdaderos','Dos','Depende del `else`'], a:0,
     why:'Entra solo el primer bloque verdadero, o el `else` si ninguno lo fue.'},
    {t:'quiz', q:'¿Qué imprime?', code:L('edad = 18','if edad > 18:','    print("Mayor")','else:','    print("No es mayor")'), opts:['`Mayor`','`No es mayor`','Las dos','Da error'], a:1,
     why:'`18 > 18` es falso porque son iguales. Para incluir al 18 habría que usar `>=`.'}
  ]

{
  title:'Bucle for', sub:'Repetir con range',
  cards:[
    {h:'¿Para qué sirve un bucle?', p:['Imaginá que querés escribir "Hola" 3 veces. Podés copiar el `print` tres veces, pero ¿y si fueran 100? Un **bucle** le dice a Python: "repetí esto tantas veces".','Python tiene dos tipos de bucle: `for` y `while`. Empezamos con `for`, que se usa cuando sabés cuántas veces querés repetir algo. Las dos versiones de abajo hacen exactamente lo mismo.'],
     code:L('# Sin bucle: hay que copiar y pegar','print("Hola")','print("Hola")','print("Hola")','','# Con bucle: se escribe una sola vez','for vez in range(3):','    print("Hola")')},
    {h:'Las partes de un for', p:['Mirá la primera línea: `for` avisa que empieza un bucle. `vez` (o `i`, o el nombre que quieras) es una variable que **crea el propio bucle**. `range(3)` dice cuántas vueltas dar. Y el `:` del final abre el bloque.','Las líneas con sangría (4 espacios hacia la derecha) son el **bloque**: justo lo que se repite en cada vuelta. En cuanto una línea vuelve a estar pegada a la izquierda, ya no es parte del bucle. Si te olvidás el `:` Python da `SyntaxError`.'],
     code:L('for i in range(3):   # empieza el bucle','    print("Hola")    # con sangría: se repite','print("Fin")         # sin sangría: se ejecuta una sola vez, al final','','# Hola','# Hola','# Hola','# Fin')},
    {h:'Qué es range(3)', p:['`range(3)` fabrica una lista de números para que el `for` los vaya usando uno por uno. Es: **0, 1, 2**.','Dos cosas que confunden al principio: en programación se cuenta **desde 0**, y el número final **no se incluye**. Por eso `range(3)` son 3 números (0, 1 y 2) y da 3 vueltas, pero el 3 no aparece.'],
     code:L('for i in range(3):','    print(i)','# 0','# 1','# 2')},
    {h:'Qué vale i en cada vuelta', p:['`i` es una variable común, pero la maneja el `for`: en cada vuelta le asigna el **siguiente número** de `range`. Cuando se acaban los números, el bucle termina solo.','Cuando un bucle te confunda, hacé esto: andá vuelta por vuelta, anotando cuánto vale la variable y qué hace el bloque.'],
     code:L('for i in range(3):','    print("vuelta número", i)','','# 1ª vuelta: i vale 0 → "vuelta número 0"','# 2ª vuelta: i vale 1 → "vuelta número 1"','# 3ª vuelta: i vale 2 → "vuelta número 2"','# ya no quedan números: el bucle termina')},
    {h:'Empezar en otro número y saltear', p:['`range` acepta más de un número. Con **dos**, `range(inicio, fin)`: empieza en `inicio` y llega hasta `fin - 1` (el `fin` sigue sin incluirse).','Con **tres**, `range(inicio, fin, paso)`: el tercero dice de a cuánto avanza. Con `paso` 2 va de dos en dos.'],
     code:L('range(5)          # 0, 1, 2, 3, 4','range(1, 6)       # 1, 2, 3, 4, 5','range(2, 6)       # 2, 3, 4, 5','range(0, 10, 2)   # 0, 2, 4, 6, 8')},
    {h:'Recorrer un texto', p:['`for` no sirve solo con números: recorre **cualquier cosa que tenga elementos**. Un texto está hecho de letras, así que `for` lo recorre letra por letra, una por vuelta.','Fijate que la variable ahora se llama `letra` y no `i`: elegí el nombre que mejor describa lo que vale en cada vuelta.'],
     code:L('for letra in "sol":','    print(letra)','','# 1ª vuelta: letra vale "s"','# 2ª vuelta: letra vale "o"','# 3ª vuelta: letra vale "l"')},
    {h:'Dentro o fuera del bucle', p:['La sangría decide **qué se repite**. Mismo código, una sola diferencia, resultados distintos: en el primero las dos líneas están dentro del bucle y se repiten juntas; en el segundo, `Chau` está afuera y se ejecuta una sola vez cuando el bucle ya terminó.'],
     code:L('for i in range(2):','    print("Hola")','    print("Chau")','# Hola, Chau, Hola, Chau','','for i in range(2):','    print("Hola")','print("Chau")','# Hola, Hola, Chau')},
    {h:'Acumular un total', p:['Un patrón que vas a usar muchísimo: crear una variable en 0 **antes** del bucle y, en cada vuelta, sumarle algo con `+=` (que es lo mismo que `suma = suma + n`).','Va antes del bucle a propósito: si `suma = 0` estuviera adentro, volvería a 0 en cada vuelta y perderías lo acumulado.'],
     code:L('suma = 0','for n in range(1, 4):','    suma += n','print(suma)   # 6','','# n vale 1 → suma = 0 + 1 = 1','# n vale 2 → suma = 1 + 2 = 3','# n vale 3 → suma = 3 + 3 = 6')}
  ],
  ex:[
    {t:'quiz', q:'¿Qué imprime?', code:L('for i in range(3):','    print(i)'), opts:['`0, 1, 2`','`1, 2, 3`','`0, 1, 2, 3`','`1, 2`'], a:0,
     why:'`range(3)` empieza en 0 y llega hasta 2: el final no se incluye.'},
    {t:'fill', q:'Completá para repetir 5 veces.', code:L('for i in ___(5):','    print(i)'), ans:['range'], bank:['range','len','while','list'],
     why:'`range(5)` genera los números del 0 al 4.'},
    {t:'quiz', q:'¿Qué números recorre `range(2, 6)`?', opts:['`2, 3, 4, 5, 6`','`2, 3, 4, 5`','`3, 4, 5, 6`','`2, 6`'], a:1,
     why:'Empieza en 2 e incluye hasta el 5; el 6 queda afuera.'},
    {t:'bug', q:'Tocá la línea con el error.', code:L('for i in range(3)','    print(i)'), line:0,
     why:'Falta el `:` al final del `for`.',
     fix:{q:'¿Cómo se arregla?', opts:['Agregar `:` al final del `for`','Cambiar `range(3)` por `range[3]`','Quitar el `print`','Indentar el `for`'], a:0}},
    {t:'fill', q:'Sumá cada `n` a `suma`.', code:L('suma = 0','for n in range(2, 5):','    suma ___ n','print(suma)'), ans:['+='], bank:['+=','=','==','++'],
     why:'`+=` suma `n` a lo que ya hay en `suma`. Python no tiene `++`. El resultado es 2 + 3 + 4 = 9.'},
    {t:'quiz', q:'¿Qué imprime?', code:L('for letra in "sol":','    print(letra)'), opts:['`sol`, una vez','`s`, `o`, `l`, una por línea','`sol`, tres veces','Da error'], a:1,
     why:'Un `for` sobre un texto recorre sus letras, una por vuelta.'},
    {t:'quiz', q:'¿Cuántas veces imprime `hola`?', code:L('for i in range(4):','    print("hola")'), opts:['3','4','5','Una'], a:1,
     why:'`range(4)` da 4 vueltas (0, 1, 2 y 3).'}
  ]
},
{
  title:'Bucle while', sub:'Repetir hasta que se cumpla',
  cards:[
    {h:'Repetir mientras algo sea cierto', p:['`for` se usa cuando sabés cuántas vueltas son. `while` ("mientras") se usa cuando **no lo sabés**, pero sí sabés hasta cuándo: repetís **mientras** una condición sea verdadera.','Pensalo como "mientras tengas hambre, seguí comiendo": no sabés cuántos bocados van a ser, depende de cuándo se te pase el hambre.'],
     code:L('n = 3','while n > 0:      # "mientras n sea mayor que 0"','    print(n)','    n -= 1       # resta 1 a n','print("¡Despegue!")','','# 3','# 2','# 1','# ¡Despegue!')},
    {h:'Cómo lo piensa Python', p:['En cada vuelta, Python hace siempre lo mismo: **1)** mira la condición. **2)** Si es `True`, ejecuta el bloque y vuelve al paso 1. **3)** Si es `False`, sale del bucle y sigue con lo que viene abajo.','Mirá el mismo ejemplo vuelta por vuelta. Fijate que cuando `n` llega a 0, la condición `0 > 0` es falsa y el bucle termina **sin imprimir el 0**.'],
     code:L('n = 3','while n > 0:','    print(n)','    n -= 1','','# n vale 3 → 3 > 0 es True  → imprime 3, n pasa a 2','# n vale 2 → 2 > 0 es True  → imprime 2, n pasa a 1','# n vale 1 → 1 > 0 es True  → imprime 1, n pasa a 0','# n vale 0 → 0 > 0 es False → sale del bucle')},
    {h:'Cuidado: el bucle infinito', p:['Para que un `while` termine, **algo dentro del bloque tiene que cambiar** hasta que la condición deje de cumplirse. Si no cambia nada, la condición es verdadera para siempre y el programa se queda repitiendo sin parar. Eso se llama **bucle infinito**.','Antes de escribir un `while`, preguntate: ¿qué línea de adentro hace que algún día la condición sea falsa?'],
     code:L('n = 3','while n > 0:','    print(n)','    # falta "n -= 1": n siempre vale 3','    # y 3 > 0 es siempre True: nunca termina')},
    {h:'while True y break', p:['`while True` es un bucle que **nunca termina por sí solo**, porque `True` siempre es verdadero. Se usa cuando querés que la salida se decida adentro, con `break`.','`break` significa "cortá el bucle ahora mismo". En el ejemplo, el programa sigue pidiendo texto una y otra vez, y solo sale cuando escribís "salir".'],
     code:L('while True:','    texto = input("> ")','    if texto == "salir":','        break              # corta el bucle','    print("Escribiste:", texto)','','print("Chau")             # se ejecuta después del break')},
    {h:'break y continue: la diferencia', p:['`break` es "me voy, se terminó": **corta todo el bucle**. `continue` es "esta vuelta no, paso a la siguiente": **saltea solo lo que falta de esa vuelta** y el bucle sigue.','Las dos sirven en `for` y en `while`. Comparalas con el mismo código: cuando `i` vale 3, en un caso se corta todo y en el otro solo se saltea el 3.'],
     code:L('for i in range(5):','    if i == 3:','        break','    print(i)    # 0, 1, 2','','for i in range(5):','    if i == 3:','        continue','    print(i)    # 0, 1, 2, 4')},
    {h:'¿for o while?', p:['Usá `for` cuando sabés **cuántas vueltas** son o tenés **algo para recorrer**: un `range`, un texto, una lista.','Usá `while` cuando depende de **una condición** y no sabés cuántas vueltas hacen falta: por ejemplo, seguir pidiendo la clave hasta que acierten.'],
     code:L('# for: sé que son 5 vueltas','for i in range(5):','    print(i)','','# while: depende de lo que escriba la persona','clave = ""','while clave != "1234":','    clave = input("Clave: ")')}

function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function currentStreak(){
  if(!save.last) return 0;
  const y=new Date(); y.setDate(y.getDate()-1);
  return (save.last===dayKey()||save.last===dayKey(y))?save.streak:0;
}
function bumpStreak(){
  const today=dayKey(); if(save.last===today) return;
  const y=new Date(); y.setDate(y.getDate()-1);
  save.streak=(save.last===dayKey(y))?save.streak+1:1; save.last=today;

function el(tag,attrs){

  for(const k in attrs){const v=attrs[k];
    if(k==='class') e.className=v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else if(v===true) e.setAttribute(k,'');
    else if(v!==false&&v!=null) e.setAttribute(k,v);
  }
  for(let i=2;i<arguments.length;i++){
    const kids=[].concat(arguments[i]);
    for(const c of kids){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(c)); }
  }
  return e;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rich(s){

const KW=new Set(['if','elif','else','for','while','in','and','or','not','True','False','None','break','continue','def','return','import','from','as','class','try','except','finally','raise','with','lambda','pass','global','is','assert','del','yield']);
const FN=new Set(['print','input','int','float','str','bool','range','len','type','list','dict','set','tuple','sum','min','max','sorted','enumerate','zip','open','abs','round','isinstance','map','filter','super','reversed']);
const TOK=/(f?"[^"\n]*"|f?'[^'\n]*'|#.*$|___|\d+(?:\.\d+)?|[A-Za-z_]\w*|\s+|.)/g;
function hlLine(line,onBlank){
  const f=document.createDocumentFragment();
  line.split('___').forEach((seg,k)=>{
    if(k>0) f.append(onBlank());
    TOK.lastIndex=0; let m;
    while((m=TOK.exec(seg))){
      const t=m[0]; if(t==='') {TOK.lastIndex++; continue;}
      let c='';
      if(t[0]==='#') c='cm'; else if(/^f?["']/.test(t)) c='str'; else if(/^\d/.test(t)) c='num-t'; else if(KW.has(t)) c='kw'; else if(FN.has(t)) c='fn';
      f.append(c?el('span',{class:c},t):t);
    }
  });
  return f;
}

    }));

function codeBug(c){

  lines.forEach((l,i)=>{

/* ---------- Estado ---------- */
let S=null; // null = inicio
function startLesson(i){
  celebrate=null;
  const les=LESSONS[i];
  S={li:i,les,view:les.cards.length?'cards':'ex',ci:0,queue:les.ex.map(ex=>({ex,retry:false,tries:0})),qi:0,cur:null,first:0,good:0,xp:0,total:les.ex.length,stars:0};
  if(S.view==='ex') S.cur=prep(S.queue[0]);
  render(true);
}
function prep(item){
  const ex=item.ex, c={item,ex,checked:false,ok:null,step:0};
  if(ex.t==='fill'){c.bank=shuffle(Array.from(new Set(ex.bank)));c.filled=ex.ans.map(()=>null);}
  if(ex.t==='quiz'){c.opts=shuffle(ex.opts.map((t,i)=>({t,ok:i===ex.a})));c.sel=null;}
  if(ex.t==='bug'){c.sel=null;c.fixOpts=shuffle(ex.fix.opts.map((t,i)=>({t,ok:i===ex.fix.a})));c.fixSel=null;c.wrongLine=false;}
  return c;
}
function goHome(){S=null;render(true);}
function ready(c){
  const ex=c.ex;
  if(ex.t==='fill') return c.filled.every(v=>v!==null);
  if(ex.t==='quiz') return c.sel!==null;
  if(ex.t==='bug') return c.step===0?c.sel!==null:c.fixSel!==null;
  return false;
}
function check(){
  const c=S.cur, ex=c.ex;
  if(ex.t==='bug'&&c.step===0){
    if(c.sel===ex.line){c.step=1;render();return;}
    c.wrongLine=true;c.ok=false;
  } else if(ex.t==='bug'){ c.ok=c.fixOpts[c.fixSel].ok; }
  else if(ex.t==='fill'){ c.ok=c.filled.every((v,i)=>v===ex.ans[i]); }
  else { c.ok=c.opts[c.sel].ok; }
  c.checked=true;
  const it=c.item;
  if(c.ok){ S.good++; S.xp+=it.retry?4:10; if(!it.retry) S.first++; }
  else if(it.tries<2){ S.queue.push({ex,retry:true,tries:it.tries+1}); }
  render();
}
function next(){
  S.qi++;
  if(S.qi>=S.queue.length) return finish();
  S.cur=prep(S.queue[S.qi]); render(true);
}
function finish(){
  const acc=S.first/S.total;
  S.stars=acc>=0.85?3:acc>=0.6?2:1;
  const wasNew=!save.done[S.li];
  const prev=(save.done[S.li]&&save.done[S.li].stars)||0;
  save.done[S.li]={stars:Math.max(prev,S.stars)};
  save.xp+=S.xp; bumpStreak(); persist();
  celebrate=wasNew?S.li:null;
  S.view='done'; render(true);
}
function feedback(c){
  const ex=c.ex, out=[];
  if(c.ok){ out.push(ex.why); return {head:'Correcto',body:out}; }
  if(ex.t==='fill') out.push('Era: '+ex.ans.map(a=>'`'+a+'`').join(' y ')+'.');
  else if(ex.t==='quiz') out.push('La respuesta era '+ex.opts[ex.a]+'.');
  else if(c.wrongLine) out.push('El error está en la línea '+(ex.line+1)+'.');
  else out.push('La corrección era: '+ex.fix.opts[ex.fix.a]+'.');
  out.push(ex.why);
  return {head:'No era esa',body:out};
}

const pos=j=>({x:j%2===0?XL:XR,y:Y0+j*STEP});
function connD(j){const a=pos(j),b=pos(j+1),m=(a.y+b.y)/2;return 'M'+a.x+' '+a.y+' C'+a.x+' '+m+' '+b.x+' '+m+' '+b.x+' '+b.y;}
function firstNotDone(set){for(let i=0;i<LESSONS.length;i++) if(!set.has(i)) return i; return -1;}
function statesOf(set){const f=firstNotDone(set);return LESSONS.map((_,i)=>set.has(i)?'done':(i===f?'current':'locked'));}

/* Lecciones consecutivas con la misma semana forman un grupo; en cada grupo el camino vuelve a empezar */
function weekGroups(){
  const g=[];
  LESSONS.forEach((l,i)=>{
    const w=l.week||1, last=g[g.length-1];
    if(last&&last.week===w) last.idx.push(i); else g.push({week:w,name:l.weekName||'',idx:[i]});

/* Al volver de completar una lección: se muestra el estado anterior y se anima el cambio por etapas.
   Si era la última de la semana, también se desbloquea el cartel de la semana siguiente. */
function afterHome(root,realSet,pending,initSet){
  homeTimers.forEach(clearTimeout); homeTimers=[];
  const groups=weekGroups();
  const nodeAt=i=>root.querySelector('.node[data-i="'+i+'"]');
  const bannerAt=w=>root.querySelector('.wbanner[data-w="'+w+'"]');
  const go=(ms,fn)=>homeTimers.push(setTimeout(fn,ms));
  const show=(e,smooth)=>{if(e) e.scrollIntoView({block:'center',behavior:smooth?'smooth':'auto'});};
  /* Si la lección es la primera de una semana que no es la 1, se muestra el cartel junto con el círculo */
  const focusOf=i=>{const g=groups.find(x=>x.idx[0]===i&&x.week>1);return g?bannerAt(g.week):nodeAt(i);};
  if(pending===null){
    const f=firstNotDone(realSet);
    if(f>=0){const t=focusOf(f); if(f>=2||(t&&t.classList.contains('wbanner'))) show(t,false);}
    return;
  }
  const before=statesOf(initSet), after=statesOf(realSet);
  const bBefore=groups.map(g=>bannerState(g,before)), bAfter=groups.map(g=>bannerState(g,after));
  show(nodeAt(pending),false);
  go(500,()=>{
    after.forEach((s,i)=>{if(s==='done'&&before[i]!=='done') paintNode(nodeAt(i),'done');});
    groups.forEach((g,k)=>{if(bAfter[k]==='done'&&bBefore[k]!=='done') paintBanner(bannerAt(g.week),'done');});
  });
  go(1000,()=>{root.querySelectorAll('.prg').forEach(p=>{if(realSet.has(+p.dataset.i)) p.classList.add('lit');});});
  const opened=groups.map((g,k)=>(bBefore[k]==='locked'&&bAfter[k]!=='locked')?k:-1).filter(k=>k>=0);
  let t=2000;
  if(opened.length){
    go(1400,()=>{
      opened.forEach(k=>{
        const b=bannerAt(groups[k].week); paintBanner(b,bAfter[k]); b.classList.add('unlocking');
        b.addEventListener('animationend',()=>b.classList.remove('unlocking'),{once:true});
      });
      show(bannerAt(groups[opened[0]].week),true);
    });
    t=2900;
  }
  go(t,()=>{
    let first=-1;
    after.forEach((s,i)=>{
      if(s==='current'&&before[i]!=='current'){
        const n=nodeAt(i); paintNode(n,'current'); n.classList.add('unlocking');
        n.addEventListener('animationend',()=>n.classList.remove('unlocking'),{once:true});
        if(first<0) first=i;
      }
    });
    if(first>=0) show(nodeAt(first),true);
  });
}
function Home(){
  const realSet=new Set(Object.keys(save.done).map(Number));
  const pending=celebrate; celebrate=null;
  const initSet=new Set(realSet); if(pending!==null) initSet.delete(pending);
  const map=buildMap(initSet);
  const cur=LESSONS[firstNotDone(realSet)]||LESSONS[LESSONS.length-1];
  const weekLabel='Semana '+(cur.week||1)+' · '+(cur.weekName||'Fundamentos');
  homeAfter=()=>afterHome(map,realSet,pending,initSet);
  const n=Object.keys(save.done).length, st=currentStreak();
  return el('div',{},
    el('header',{class:'head'},el('p',{class:'eyebrow'},weekLabel),el('h1',{},'Python desde cero')),
    el('div',{class:'stats'},
      stat('flame','flame',st,st===1?'día de racha':'días de racha'),
      stat('bolt','spark',save.xp,'XP'),
      stat('check','good',n+'/'+LESSONS.length,'lecciones')),
    el('p',{class:'lead'},'Completá cada lección para abrir la siguiente. Leé, completá el código y encontrá el error: unos 5 minutos por lección.'),
    map,
  );
}
function Topbar(){
  const pct=S.view==='ex'?Math.round(S.good/S.total*100):(S.view==='done'?100:0);
  return el('div',{class:'topbar'},
    el('button',{class:'icon-btn',type:'button','aria-label':'Salir de la lección',onclick:goHome},icon('x')),
    el('div',{class:'bar',role:'progressbar','aria-valuemin':'0','aria-valuemax':'100','aria-valuenow':String(pct),'aria-label':'Progreso de la lección'},el('i',{style:'width:'+pct+'%'})));
}
function dock(cls,kids){return el('div',{class:'dock '+(cls||'')},el('div',{class:'dock-in'},kids));}
function btn(label,fn,disabled,ghost){return el('button',{class:'btn'+(ghost?' ghost':''),type:'button',disabled:!!disabled,onclick:fn},label);}

function Cards(){
  const card=S.les.cards[S.ci], last=S.ci===S.les.cards.length-1;
  const body=el('article',{class:'card'},el('h2',{},card.h),card.p.map(p=>el('p',{},rich(p))),card.code?codeStatic(card.code):null);
  const main=el('div',{},Topbar(),el('p',{class:'kicker'},'Leé esto · '+(S.ci+1)+' de '+S.les.cards.length),body);
  const d=dock('',[btn(last?'Empezar a practicar':'Entendido',()=>{
    if(last){S.view='ex';S.cur=prep(S.queue[0]);} else S.ci++;
    render(true);
  })]);
  return [main,d];
}
const KICK={fill:'Completá el código',bug:'Encontrá el error',quiz:'Elegí la respuesta'};
function Exercise(){
  const c=S.cur, ex=c.ex;
  const sec=el('section',{},Topbar(),el('p',{class:'kicker'},KICK[ex.t]),el('h2',{class:'q'},rich(ex.q)));
  if(ex.t==='quiz'){
    if(ex.code) sec.append(codeStatic(ex.code));
    sec.append(el('div',{class:'opts'},c.opts.map((o,i)=>{
      let cls='opt';
      if(c.checked){ if(o.ok) cls+=' right'; else if(i===c.sel) cls+=' wrong'; }
      else if(i===c.sel) cls+=' sel';
      return el('button',{class:cls,type:'button',disabled:c.checked,'aria-pressed':String(i===c.sel),onclick:()=>{c.sel=i;render();}},
        el('span',{class:'k'},String.fromCharCode(65+i)),el('span',{},rich(o.t)));
    })));
  }
  if(ex.t==='fill'){
    sec.append(codeFill(c));
    sec.append(el('div',{class:'bank',role:'group','aria-label':'Opciones'},c.bank.map(b=>el('button',{class:'chip',type:'button',disabled:c.checked,onclick:()=>{
      const i=c.filled.indexOf(null); if(i>-1){c.filled[i]=b;render();}
    }},b))));
  }
  if(ex.t==='bug'){
    sec.append(codeBug(c));
    if(c.step===1){
      sec.append(el('p',{class:'hint-ok'},icon('check'),'Esa es la línea.'));
      sec.append(el('h3',{class:'sub-q'},ex.fix.q));
      sec.append(el('div',{class:'opts'},c.fixOpts.map((o,i)=>{
        let cls='opt';
        if(c.checked){ if(o.ok) cls+=' right'; else if(i===c.fixSel) cls+=' wrong'; }
        else if(i===c.fixSel) cls+=' sel';
        return el('button',{class:cls,type:'button',disabled:c.checked,'aria-pressed':String(i===c.fixSel),onclick:()=>{c.fixSel=i;render();}},
          el('span',{class:'k'},String.fromCharCode(65+i)),el('span',{},rich(o.t)));
      })));
    }
  }
  let d;
  if(!c.checked) d=dock('',[btn('Comprobar',check,!ready(c))]);
  else{
    const f=feedback(c);
    d=dock(c.ok?'good':'bad',[
      el('div',{class:'fb',role:'status'},el('h3',{},icon(c.ok?'check':'x'),f.head),f.body.map(t=>el('p',{},rich(t)))),
      btn('Continuar',next)]);
  }
  return [sec,d];
}
function Done(){
  const les=S.les;
  const main=el('div',{},Topbar(),el('section',{class:'done'},
    stars(S.stars,true),
    el('h2',{},'Lección completa'),
    el('p',{class:'ttl'},les.title),
    el('div',{class:'res'},
      el('div',{},el('strong',{},'+'+S.xp),el('span',{},'XP ganados')),
      el('div',{},el('strong',{},S.first+'/'+S.total),el('span',{},'a la primera')),
      el('div',{},el('strong',{},String(currentStreak())),el('span',{},currentStreak()===1?'día de racha':'días de racha')))));
  return [main,dock('',[btn('Continuar',goHome)])];
}

const root=document.getElementById('app');
function render(top){
  homeTimers.forEach(clearTimeout); homeTimers=[];
  const y=window.scrollY;
  root.replaceChildren();
  if(!S){ root.className='app'; root.append(Home()); }
  else{
    const parts=S.view==='cards'?Cards():S.view==='ex'?Exercise():Done();
    root.className='app has-dock';
    root.append(parts[0],parts[1]);
  }
  window.scrollTo(0,top?0:y);
  if(!S&&homeAfter){const h=homeAfter;homeAfter=null;h();}
}
render(true);
})();
</script>
