<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#0B121B;color:#E8EEF5;font-family:system-ui,sans-serif;text-align:center}
  main{display:grid;gap:14px;max-width:320px}
  h1{margin:0;font-size:1.5rem}
  p{margin:0;color:#93A1B4;line-height:1.45}
  button{min-height:48px;border:0;border-radius:12px;background:#5AB8EE;color:#06141F;font-size:1rem;font-weight:700}
</style>
</head>
<body>
<main>
  <h1>Sin conexión</h1>
  <p>La app necesita internet para cargar las lecciones. Conectate y volvé a intentar.</p>
  <button type="button" onclick="history.back()">Reintentar</button>
</main>
</body>
</html>
