name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/assets/icon-only.png'

permissions:
  contents: write

env:
  APP_URL: https://learn-pythonl.netlify.app/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Verificar que existe el icono
        run: |
          if [ ! -f app/assets/icon-only.png ]; then
            echo "ERROR: falta app/assets/icon-only.png"
            echo "Subí tu icono (PNG 1024x1024) a esa ruta y volvé a correr el workflow."
            exit 1
          fi

      - name: Crear el proyecto Capacitor
        run: |
          mkdir -p app/www
          cd app
          cat > package.json <<'EOF'
          {
            "name": "learn-python-apk",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/core": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/assets": "^3.0.5",
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.learnpython.app",
            "appName": "Learn Python",
            "webDir": "www",
            "server": { "url": "$APP_URL", "androidScheme": "https" }
          }
          EOF
          cat > www/index.html <<EOF
          <!doctype html>
          <html lang="es"><head><meta charset="utf-8"><title>Learn Python</title></head>
          <body><script>location.replace("$APP_URL")</script></body></html>
          EOF

      - name: Instalar dependencias
        working-directory: app
        run: npm install

      - name: Generar el proyecto Android y los íconos
        working-directory: app
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Compilar el APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Learn-Python-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar el APK en Releases
        working-directory: app/android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Learn-Python.apk
          gh release delete apk-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create apk-latest Learn-Python.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "APK más reciente" \
            --notes "Compilado desde el commit $GITHUB_SHA"
